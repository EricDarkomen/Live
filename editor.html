<div id="app" data-mode="levels">

  <!-- ONE row, on every screen. It used to be two horizontally-scrolling strips
       because fifteen controls had to fit a 390px phone; the tools and the zoom
       float over the map now, so what is left is a level, an undo pair and two
       menus — which fits a 320px screen without scrolling at all. -->
  <header id="bar">
    <span class="brand">🗺️ <b id="edBrandName">Game</b> editor</span>

    <!-- Which of the three documents. A segmented control where there is room
         for one and a single button behind a menu where there is not — the same
         field shown twice, exactly like the layer switches below. -->
    <div class="modes fine-only" id="edModes" role="group" aria-label="What to edit">
      <button data-mode="levels" class="on" title="The building"><svg class="ic"><use href="#i-levels"/></svg><b>Levels</b></button>
      <button data-mode="jobs" title="The quests"><svg class="ic"><use href="#i-jobs"/></svg><b>Jobs</b></button>
      <button data-mode="talk" title="Who everybody is and what they say"><svg class="ic"><use href="#i-talk"/></svg><b>People</b></button>
      <button data-mode="things" title="How objects are furnished and what they do"><svg class="ic"><use href="#i-things"/></svg><b>Objects</b></button>
      <button data-mode="zones" title="What a room is made of — colours, textures and floors"><svg class="ic"><use href="#i-room"/></svg><b>Rooms</b></button>
      <button data-mode="office" title="Events, chat, email, the opening and the endings"><svg class="ic"><use href="#i-day"/></svg><b>The day</b></button>
      <button data-mode="prog" title="Items, shops, skills and achievements"><svg class="ic"><use href="#i-prog"/></svg><b>Rewards</b></button>
      <button data-mode="calls" title="Callers, moves, tells and bosses — the call itself"><svg class="ic"><use href="#i-calls"/></svg><b>Calls</b></button>
      <button data-mode="art" title="Tilesets and character sheets"><svg class="ic"><use href="#i-art"/></svg><b>Art</b></button>
      <button data-mode="games" title="The minigames: pads, wording, and what opens each one"><svg class="ic"><use href="#i-arcade"/></svg><b>Arcade</b></button>
    </div>
    <!-- WHAT YOU ARE EDITING — the mode and the subject as one control, because
         they are one question with two halves. Shown wherever the segmented
         control and the level select are not, which is any window under 1000px
         and every phone. It replaced an icon with no word on it and a <select>
         that had 80px to say "CALLHALL Services · Fourth Floor" in: the two
         most important pieces of state on the page were the two least legible.
         Pressing it opens the picker, which is the same field a third time —
         nine modes, then this mode's subjects with a filter over them, which a
         native select cannot do at seventy object kinds. -->
    <button id="edPick" class="what" aria-haspopup="dialog" title="What you are editing">
      <svg class="ic w-i"><use href="#i-levels"/></svg>
      <span class="w-t"><span class="w-k">Levels</span><span class="w-n">…</span></span>
      <svg class="ic w-c" aria-hidden="true"><use href="#i-pick"/></svg>
    </button>

    <label class="fld" id="edSubjectLbl">Level
      <select id="edSubject" aria-label="Level"></select>
    </label>

    <div class="hist">
      <button id="edUndo" title="Undo"><svg class="ic"><use href="#i-undo"/></svg></button>
      <!-- Redo is in the overflow menu on a phone, with the name of the thing
           it would put back. A 320px bar has room for about four things, and a
           button that is disabled nine times in ten is not one of them. -->
      <button id="edRedo" class="fine-only" title="Redo"><svg class="ic"><use href="#i-redo"/></svg></button>
    </div>

    <span class="spacer"></span>

    <!-- Desktop keeps the layer switches in the open; a phone gets the same four
         behind one button, because a checkbox row is four targets' worth of a
         bar that has room for five things in total. -->
    <div class="toggles" id="edToggles">
      <label title="Tile grid"><input type="checkbox" id="edGrid" checked> grid</label>
      <label title="Room and door outlines"><input type="checkbox" id="edPlan" checked> plan</label>
      <label title="Highlight what validation found"><input type="checkbox" id="edFaults" checked> faults</label>
      <label title="Where the colleagues are sent (WP)"><input type="checkbox" id="edWps"> waypoints</label>
    </div>
    <button id="edLayers" class="coarse-only" title="Layers" aria-label="Layers"><svg class="ic"><use href="#i-layers"/></svg></button>

    <!-- What state the whole game is in: what is on the bench and what every
         check found, added up across all nine documents. The bar is where a
         build status belongs — it is the one thing that is true of the page
         rather than of whatever you happen to be looking at. On a phone it is
         in the overflow menu and at the top of the picker instead. -->
    <button id="edProject" class="status fine-only" title="What is on the bench, and what the checks found">
      <svg class="ic"><use href="#i-all"/></svg><span class="pill" id="edProjectN"></span>
    </button>
    <button id="edHelp" class="ghost fine-only" title="Tools, gestures and shortcuts">?</button>
    <button id="edRevert" class="warn fine-only" title="Throw away every change to this level">Revert</button>
    <!-- Published beside the game, so there is somewhere to go back to. A plain
         link, not a script: the game is index.html and must stay something this
         page never has to know about. -->
    <a class="back fine-only" href="index.html" title="Open the game">▶ the game</a>
    <button id="edMore" class="coarse-only" title="More" aria-label="More"><svg class="ic"><use href="#i-more"/></svg></button>
  </header>

  <main id="stage">
    <canvas id="view" aria-label="The level being edited"></canvas>
    <!-- R.init() measures and rescales this on the way past. The editor never
         draws a minimap; it exists so the renderer can initialise unchanged. -->
    <canvas id="minimap" width="168" height="118" hidden></canvas>

    <!-- The tools float OVER the map rather than sitting in the bar: a rail down
         the side on a desktop, a strip along the bottom under the thumb on a
         phone. That is the whole reason the bar fits one row now, and it is why
         no tool is ever more than one tap away on any screen. -->
    <div id="dock">
      <div class="tools" id="edTools" role="toolbar" aria-label="Tools">
        <button data-tool="select" class="on" title="Select and drag  (V)"><svg class="ic"><use href="#i-select"/></svg><b>Select</b></button>
        <button data-tool="room" title="Drag out a room  (R)"><svg class="ic"><use href="#i-room"/></svg><b>Room</b></button>
        <button data-tool="door" title="Place a door  (D)"><svg class="ic"><use href="#i-door"/></svg><b>Door</b></button>
        <button data-tool="object" title="Place from the palette  (O)"><svg class="ic"><use href="#i-object"/></svg><b>Object</b></button>
        <button data-tool="erase" title="Delete what is on the tile  (X)"><svg class="ic"><use href="#i-erase"/></svg><b>Erase</b></button>
        <button data-tool="entry" title="Place or move an arrival point  (E)"><svg class="ic"><use href="#i-entry"/></svg><b>Entry</b></button>
        <button data-tool="counter" title="Drag out a counter  (C)"><svg class="ic"><use href="#i-counter"/></svg><b>Counter</b></button>
        <button data-tool="pan" title="Drag to move around  (H)"><svg class="ic"><use href="#i-pan"/></svg><b>Pan</b></button>
      </div>
      <!-- What the tool in your hand will actually do: the object it will place,
           or the zone it will paint. It used to be a toast that had already gone
           by the time you looked, and a Zone select at the far end of a strip
           that scrolled off a phone entirely. Ordered by CSS rather than by the
           markup, because it belongs under the rail on a desktop and above the
           strip on a phone, and those are the same element. -->
      <button id="edCtx" class="ctx" hidden></button>
    </div>

    <div id="zoomer">
      <button id="edOut" title="Zoom out  (−)">−</button>
      <span id="edZoomV">100%</span>
      <button id="edIn" title="Zoom in  (+)">+</button>
      <button id="edFit" title="Fit the whole level  (F)"><svg class="ic"><use href="#i-fit"/></svg></button>
    </div>

    <div id="hint"><kbd>1</kbd>–<kbd>8</kbd> tools · <kbd>alt</kbd>-click samples · <kbd>?</kbd> for the rest</div>
    <div id="readout"></div>

    <!-- The other two documents' workspaces, over the map rather than instead of
         it: the canvas keeps its size and the renderer keeps its camera, so
         coming back to Levels is not a reload. View.frame() stops drawing while
         one of these is up. -->
    <div class="work" id="jobsWork"></div>
    <div class="work" id="talkWork"></div>
    <div class="work" id="thingsWork"></div>
    <div class="work" id="zonesWork"></div>
    <div class="work" id="officeWork"></div>
    <div class="work" id="progWork"></div>
    <div class="work" id="callsWork"></div>
    <div class="work" id="artWork"></div>
    <div class="work" id="gamesWork"></div>
  </main>

  <aside id="side">
    <!-- The strip scrolls when six tabs will not fit 320px; the fold toggle sits
         BESIDE it rather than in it, or it is pinned over whichever tab happens
         to be at the right-hand edge. -->
    <div class="tabrow">
      <nav class="tabs" id="edTabs" role="tablist">
        <button data-tab="inspect" class="on">Inspect</button>
        <button data-tab="read" hidden>Read</button>
        <button data-tab="check">Check <span class="pill" id="edFaultN"></span></button>
        <button data-tab="palette">Palette</button>
        <button data-tab="level">Level</button>
        <button data-tab="export">Export</button>
      </nav>
      <!-- Phone only. The panel is a bottom sheet there, and a sheet that cannot
           be got out of the way is a sheet that has taken half the map. -->
      <button id="edSheet" class="sheet-toggle" title="Collapse the panel" aria-label="Collapse the panel">▾</button>
    </div>
    <div class="pane on" id="paneInspect"></div>
    <div class="pane" id="paneRead"></div>
    <div class="pane" id="paneCheck"></div>
    <div class="pane" id="panePalette"></div>
    <div class="pane" id="paneLevel"></div>
    <div class="pane" id="paneExport"></div>
  </aside>

</div>

<!-- How art gets in. A file the person chose is handed to the page by the
     browser and works everywhere the editor does — including off file://,
     where fetching that same file is refused outright. -->
<input type="file" id="edFile" accept="image/png,image/webp,image/gif" hidden>

     ?v= stamps identical to index.html's: a file missing here is a system the
     checks cannot see (they called the whole workshop unearnable), and a stale
