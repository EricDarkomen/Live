<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Bum Bay — a cute, crude little island farming game.">
<meta name="author" content="Grant van Zyl">
<meta name="theme-color" content="#2ec4e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bum Bay">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Bum Bay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap">
<link rel="stylesheet" href="bay/bay.css">
</head>
<body>
<canvas id="world"></canvas>

<header id="hud">
  <div class="pill lvl"><span class="star">⭐<b id="lvl">1</b></span><span class="xp"><i id="xpFill"></i></span></div>
  <div class="pill">🪙 <b id="coins">0</b></div>
  <div class="pill">✨💩 <b id="gold">0</b></div>
  <div class="pill joy" title="Decoration tip bonus">🦩 <b id="joy">+0%</b></div>
</header>

<button id="captain"><span class="face">🧔‍♂️</span><span id="capTask">…</span></button>

<div id="modeBar"><span id="modeTxt"></span><button id="modeX">Done</button></div>
<div id="toasts"></div>

<nav id="bar">
  <button id="bShop"><span>🛒</span>Shop</button>
  <button id="bOrders"><span>⛵</span>Boats<i class="badge" id="oBadge">0</i></button>
  <button id="bBarn"><span>🎒</span>Barn</button>
  <button id="bQuest"><span>📜</span>Quests<i class="badge" id="qBadge">!</i></button>
  <button id="bMenu"><span>⚙️</span></button>
</nav>

<div id="scrim"></div>
<section id="sheet">
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetX" aria-label="Close">✕</button></div>
  <div id="sheetBody"></div>
</section>

<div id="levelUp">
  <div class="lu">
    <div class="burst">⭐</div>
    <h2>LEVEL <span id="lvlNum">2</span>!</h2>
    <p id="lvlLine"></p>
    <p id="lvlUnlock" class="unlock"></p>
    <button id="lvlOk" class="go big">Nice 👍</button>
  </div>
</div>

<section id="title">
  <div class="sun"></div>
  <div class="tisle">🏝️</div>
  <h1>Bum <span>Bay</span></h1>
  <p class="tag">Paradise. Mostly. It smells a bit.</p>
  <div class="tfloat"><span>💩</span><span>🐔</span><span>🫘</span><span>🧻</span><span>🦀</span><span>💨</span></div>
  <button id="btnPlay" class="go big">🧻 Play</button>
  <button id="btnNew" class="linkish" style="display:none">Start a new island</button>
  <small>Best on a phone. Headphones recommended. Nose plugs optional.</small>
</section>

<script src="bay/data.js"></script>
<script src="bay/game.js"></script>
<script src="bay/render.js"></script>
<script src="bay/ui.js"></script>
<script src="bay/main.js"></script>
</body>
</html>
